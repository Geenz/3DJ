name: Build Repo Listing

on: 
  workflow_dispatch:
  workflow_run:
    workflows: [Build Release]
    types:
      - completed
  push:
    branches: [main]
  release:
     types: [published, edited, created, unpublished, deleted, released]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:

  build-listing:
    name: build-listing
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v3 # check out this repo
      - uses: actions/checkout@v3 # check out automation repo
        with:
          repository: ${{ vars.LISTING_ACTION_REPO || 'vrchat-community/package-list-action' }}
          path: ${{env.pathToCi}}
          clean: false # otherwise the local repo will no longer be checked out

      - name: Restore Cache
        uses: actions/cache@v3
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Resolve Listing URL
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          listingUrl="${{ vars.LISTING_URL }}"
          urlSource="LISTING_URL"
          if [ -z "$listingUrl" ]; then
            listingUrl="https://$owner.github.io/${{ github.event.repository.name }}/index.json"
            urlSource="repository default"
          fi
          authorName="${{ vars.LISTING_AUTHOR }}"
          authorSource="LISTING_AUTHOR"
          if [ -z "$authorName" ]; then
            authorName='${{ github.repository_owner }}'
            authorSource="repository owner"
          fi
          jq --arg url "$listingUrl" --arg repo "${{ github.repository }}" --arg author "$authorName" '.url = $url | .githubRepos = [$repo] | .author.name = $author' source.json > source.json.tmp && mv source.json.tmp source.json
          echo "Listing URL: \`$listingUrl\` (from $urlSource)" >> $GITHUB_STEP_SUMMARY
          echo "Author: \`$authorName\` (from $authorSource)" >> $GITHUB_STEP_SUMMARY
          echo "listingUrl=$listingUrl" >> $GITHUB_ENV

      - name: Build Package Version Listing
        run: ${{env.pathToCi}}/build.cmd BuildMultiPackageListing --root ${{env.pathToCi}} --list-publish-directory $GITHUB_WORKSPACE/${{env.listPublishDirectory}} --current-listing-url ${{env.listingUrl}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Listing Artifact
        uses: actions/upload-artifact@v4
        with:
          name: listing
          path: ${{env.listPublishDirectory}}

  deploy:
    name: deploy
    needs: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: vars.PUBLISH_PAGES != 'false'
    steps:

      - name: Download Listing Artifact
        uses: actions/download-artifact@v4
        with:
          name: listing
          path: ${{env.listPublishDirectory}}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{env.listPublishDirectory}}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
