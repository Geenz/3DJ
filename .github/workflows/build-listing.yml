name: Build Repo Listing

on: 
  workflow_dispatch:
  workflow_run:
    workflows: [Build Release]
    types:
      - completed
  push:
    branches: [main]
  release:
     types: [published, edited, created, unpublished, deleted, released]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:

  build-listing:
    name: build-listing
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v3 # check out this repo
      - uses: actions/checkout@v3 # check out automation repo
        with:
          repository: ${{ vars.LISTING_ACTION_REPO || 'vrchat-community/package-list-action' }}
          path: ${{env.pathToCi}}
          clean: false # otherwise the local repo will no longer be checked out

      - name: Restore Cache
        uses: actions/cache@v3
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Resolve Listing URL
        run: |
          if [ -n "${{ vars.LISTING_URL }}" ]; then
            listingUrl="${{ vars.LISTING_URL }}"
            jq --arg url "$listingUrl" --arg repo "${{ github.repository }}" '.url = $url | .githubRepos = [$repo]' source.json > source.json.tmp
            mv source.json.tmp source.json
            echo "Listing URL: \`$listingUrl\` (from LISTING_URL)" >> $GITHUB_STEP_SUMMARY
          else
            listingUrl=$(jq -r '.url' source.json)
            echo "Listing URL: \`$listingUrl\` (from source.json)" >> $GITHUB_STEP_SUMMARY
            # warn since source.json's repo list will not include this fork until LISTING_URL is set
            if ! jq -e --arg repo "${{ github.repository }}" '.githubRepos | index($repo)' source.json > /dev/null; then
              echo "Warning: the listing will carry source.json's URL until LISTING_URL is set." >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "listingUrl=$listingUrl" >> $GITHUB_ENV

      - name: Build Package Version Listing
        run: ${{env.pathToCi}}/build.cmd BuildMultiPackageListing --root ${{env.pathToCi}} --list-publish-directory $GITHUB_WORKSPACE/${{env.listPublishDirectory}} --current-listing-url ${{env.listingUrl}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Listing Artifact
        uses: actions/upload-artifact@v4
        with:
          name: listing
          path: ${{env.listPublishDirectory}}

  deploy:
    name: deploy
    needs: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: vars.PUBLISH_PAGES == 'true'
    steps:

      - name: Download Listing Artifact
        uses: actions/download-artifact@v4
        with:
          name: listing
          path: ${{env.listPublishDirectory}}

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{env.listPublishDirectory}}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
